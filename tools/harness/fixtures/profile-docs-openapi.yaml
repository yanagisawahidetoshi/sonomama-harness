openapi: 3.1.0
info:
  title: SONOMAMA API
  version: 0.1.0
paths:
  /api/v1/me/profile:
    get:
      operationId: getMyProfile
      summary: ログイン中の受講生のプロフィールを取得する
      tags:
        - profile
      security:
        - bearerAuth: []
      x-sonomama-authz:
        enforcedBy: rails
        roles: []
        rule: JWTのsubに対応する本人のプロフィールだけを扱う
      x-sonomama-data:
        pii: true
        logCaution:
          - displayNameをログへ出さない
      responses:
        "200":
          description: HTTP 200
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: HTTP 401
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: HTTP 500
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateMyProfile
      summary: ログイン中の受講生のプロフィールを更新する
      tags:
        - profile
      security:
        - bearerAuth: []
      x-sonomama-authz:
        enforcedBy: rails
        roles: []
        rule: JWTのsubに対応する本人のプロフィールだけを扱う
      x-sonomama-data:
        pii: true
        logCaution:
          - displayNameをログへ出さない
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: HTTP 200
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          description: HTTP 400
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: HTTP 401
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: HTTP 422
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: HTTP 500
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/courses/{courseId}/lessons:
    get:
      operationId: listLessons
      summary: 講座のレッスン一覧を取得する
      tags:
        - course
      security: []
      x-sonomama-data:
        pii: false
        logCaution: []
      parameters:
        - name: courseId
          in: path
          required: true
          description: 講座ID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: HTTP 200
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lesson"
        "404":
          description: HTTP 404
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: HTTP 500
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 認証Providerが発行するJWT（Bearer）。検証と業務認可（x-sonomama-authz）はRails APIが行う。
  schemas:
    Error:
      type: object
      description: 全APIで共通のエラーレスポンス
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: 機械判定用のエラーコード
        message:
          type: string
          description: 利用者向けのメッセージ
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"
          description: 入力エラーなどの詳細
    ErrorDetail:
      type: object
      required:
        - message
      properties:
        field:
          type:
            - string
            - "null"
          description: 対象のフィールド
        message:
          type: string
    Profile:
      type: object
      description: 受講生プロフィール
      required:
        - id
        - displayName
        - bio
        - role
      properties:
        id:
          type: string
          format: uuid
          description: idの値
        displayName:
          type: string
          description: displayNameの値
        bio:
          type:
            - string
            - "null"
          description: bioの値
        role:
          type: string
          enum:
            - student
            - mentor
          description: roleの値
      x-sonomama-pii: true
    ProfileUpdate:
      type: object
      description: プロフィールの更新内容
      required:
        - displayName
        - bio
      properties:
        displayName:
          type: string
          description: displayNameの値
        bio:
          type:
            - string
            - "null"
          description: bioの値
      x-sonomama-pii: true
    Lesson:
      type: object
      description: レッスン
      required:
        - id
        - title
      properties:
        id:
          type: string
          description: idの値
        title:
          type: string
          description: titleの値
      x-sonomama-pii: false
