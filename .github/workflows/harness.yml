name: Harness quality gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  # Pull requests are verified against their base branch; a push to main runs every verifier and the Full Gate.
  HARNESS_SCOPE: ${{ github.event_name == 'pull_request' && format('--base origin/{0}', github.base_ref) || '--all' }}
  # The self-repair demo needs no verifier to prove its loop, so a pull request runs it without the real application verifiers (#192).
  HARNESS_DEMO_SCOPE: ${{ github.event_name != 'pull_request' && '--full' || '' }}
jobs:
  impact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      required_verifiers: ${{ steps.impact.outputs.required_verifiers }}
      full_gate: ${{ steps.impact.outputs.full_gate }}
      maestro: ${{ steps.impact.outputs.maestro }}
      head_sha: ${{ steps.impact.outputs.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0; packageManager in package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # The Harness CLI and trusted acceptance need only the root dependencies, still checked against the lockfile; restoring the workspace store would cost more.
      - run: pnpm install --frozen-lockfile --prod --ignore-workspace
      - run: pnpm harness:check
      - id: impact
        run: pnpm harness:impact $HARNESS_SCOPE
  verifiers:
    needs: impact
    if: needs.impact.outputs.required_verifiers != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Bake only lets a build write inside the verifier's working directory, so the cache sits under apps/api/tmp (ignored by Git and Docker).
      HARNESS_BUILD_CACHE_FROM: type=local,src=${{ github.workspace }}/apps/api/tmp/buildkit-cache
      HARNESS_BUILD_CACHE_TO: type=local,dest=${{ github.workspace }}/apps/api/tmp/buildkit-cache,mode=max
    strategy:
      fail-fast: false
      matrix:
        verifier: ${{ fromJson(needs.impact.outputs.required_verifiers) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # The API image layers (apt, bundle install) are restored here and reused by compose builds; a key miss rebuilds them.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/api/tmp/buildkit-cache
          key: harness-build-${{ hashFiles('**/Dockerfile', '**/Gemfile.lock') }}
          restore-keys: harness-build-
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0; packageManager in package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm harness:verify --verifier ${{ matrix.verifier }} $HARNESS_SCOPE
        env:
          # A generated Trusted Acceptance leg (#147) leaves its RSpec report here, outside the checkout so a report committed in the PR is never read.
          HARNESS_ACCEPTANCE_RESULTS: ${{ runner.temp }}/acceptance-results
      # One artifact per leg; a failed leg still uploads its report so the Completion Judge names the failing examples.
      - if: always() && startsWith(matrix.verifier, 'generated-acceptance-')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-results-${{ matrix.verifier }}
          path: ${{ runner.temp }}/acceptance-results
          if-no-files-found: ignore
  harness-test:
    needs: impact
    if: needs.impact.outputs.full_gate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The same file list in parallel shards (#197); the Completion Judge reads the combined result of the matrix.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0; packageManager in package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm harness:test
        env:
          HARNESS_TEST_SHARD: ${{ matrix.shard }}/3
  harness-demo:
    needs: impact
    if: needs.impact.outputs.full_gate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0; packageManager in package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm harness:demo $HARNESS_DEMO_SCOPE
  # Completion Judge. The job id stays "harness" because it is the required status check.
  # Mobile E2E (#68, #145): only for mobile SBIs that ask for E2E (impact maestro lanes), plus a push to main that keeps the APK cache.
  # It builds the Development Build and runs Metro and the Emulator on the runner itself, outside the Docker isolation of the other
  # verifiers (docs/security/threat-model.md). So it gets no secret, reads the repository only and never writes the shared cache from a PR.
  maestro:
    needs: impact
    # An impact without the maestro output comes from a head older than this workflow; the harness job fails it below.
    if: needs.impact.outputs.maestro != '' && (needs.impact.outputs.maestro != '[]' || github.event_name == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    env:
      MAESTRO_VERSION: 2.12.0
      MAESTRO_SHA256: a6044a84542f522f434c5dc3d609e60c7446d423f3ed1b2ae513f5c48663ec5e
      APK: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0; packageManager in package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The APK is rebuilt only when the native fingerprint (Expo SDK, React Native, native dependencies, config plugins, native config) changes.
      - id: fingerprint
        working-directory: apps/mobile
        run: echo "hash=$(pnpm exec fingerprint fingerprint:generate --platform android | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).hash))')" >> "$GITHUB_OUTPUT"
      - id: apk
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.APK }}
          key: maestro-apk-${{ steps.fingerprint.outputs.hash }}
      - if: steps.apk.outputs.cache-hit != 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - if: steps.apk.outputs.cache-hit != 'true'
        run: bash tools/harness/maestro-build.sh
      # Only main writes the shared APK cache; a pull request uses what main built or builds its own copy for this run.
      - if: github.event_name == 'push' && steps.apk.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.APK }}
          key: maestro-apk-${{ steps.fingerprint.outputs.hash }}
      - if: needs.impact.outputs.maestro != '[]'
        run: |
          curl -fsSL -o maestro.zip "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  maestro.zip" | sha256sum -c -
          unzip -q maestro.zip -d "$HOME" && echo "$HOME/maestro/bin" >> "$GITHUB_PATH"
      - if: needs.impact.outputs.maestro != '[]'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - if: needs.impact.outputs.maestro != '[]'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash tools/harness/maestro-ci.sh "$APK" "${{ github.event.pull_request.head.sha || github.sha }}" ${{ join(fromJson(needs.impact.outputs.maestro), ' ') }}
      - if: always() && needs.impact.outputs.maestro != '[]'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-results
          path: .maestro-ci/results/
          if-no-files-found: ignore
      - if: always() && needs.impact.outputs.maestro != '[]'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maestro-evidence
          path: .maestro-ci/evidence/
          if-no-files-found: ignore
  harness:
    needs: [impact, verifiers, harness-test, harness-demo, maestro]
    if: always()
    runs-on: ubuntu-latest
    # The Completion Judge reads the source SBI Issue of a Production change, and the author and commits of a dependency bot PR, from the GitHub API.
    permissions:
      contents: read
      issues: read
      pull-requests: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0; packageManager in package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile --prod --ignore-workspace
      # The maestro job's result files; a missing artifact is judged as a missing result, not skipped.
      - if: needs.impact.outputs.maestro != '[]'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maestro-results
          path: .maestro-ci/results
      # The generated acceptance reports of the verifier matrix; a missing report is judged as a failure, not skipped.
      - if: contains(needs.impact.outputs.required_verifiers, 'generated-acceptance-')
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: acceptance-results-*
          merge-multiple: true
          path: ${{ runner.temp }}/acceptance-results
      # Temporary diagnosis for #200, reverted in the next commit: can the GITHUB_TOKEN of this job read the edit history and a collaborator permission?
      # Only counts, dates and the permission name are printed.
      - name: diagnose GitHub API access (#200, temporary)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api graphql -f query='query{repository(owner:"yanagisawahidetoshi",name:"sonomama-harness"){issue(number:175){lastEditedAt userContentEdits(first:100){totalCount nodes{editedAt deletedAt}}}}}' --jq '.data.repository.issue | {lastEditedAt, totalCount: .userContentEdits.totalCount, editedAt: [.userContentEdits.nodes[].editedAt]}'
          gh api repos/${{ github.repository }}/collaborators/yanagisawahidetoshi/permission --jq '{permission, role_name}'
      - run: pnpm harness:judge $HARNESS_SCOPE
        env:
          HARNESS_NEEDS: ${{ toJson(needs) }}
          HARNESS_MAESTRO_RESULTS: .maestro-ci/results
          HARNESS_ACCEPTANCE_RESULTS: ${{ runner.temp }}/acceptance-results
          HARNESS_PULL_REQUEST: ${{ github.event.pull_request.number }}
          HARNESS_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
      # A pull_request run reads this workflow from the merge ref but the Harness from the PR head, so a head branched before a job was added
      # judges without knowing it (#163: maestro failed and the Judge passed). Whatever the head's Judge says, a failed or cancelled job, or an
      # impact without the maestro output, fails the required check.
      - if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || needs.impact.outputs.maestro == '')
        run: |
          echo "::error::A job failed or was cancelled, or the impact of this head reported no maestro output; merge main into the PR if its Harness is older than this workflow."
          exit 1
