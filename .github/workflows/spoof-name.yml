name: Spoof by job name
on: pull_request
permissions:
  checks: read
jobs:
  spoof:
    name: Completion Judge
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # finish after the real judge has published, so this success is the latest "Completion Judge"
          for i in $(seq 1 180); do
            n=$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs?check_name=Completion%20Judge" --jq '[.check_runs[] | select(.status=="completed" and .output.title!=null and (.output.title|test("FAIL|PASS|MANUAL")))] | length')
            [ "$n" -ge 1 ] && break
            sleep 30
          done
          sleep 20
          echo spoof success
