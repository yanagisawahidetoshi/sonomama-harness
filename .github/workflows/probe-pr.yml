name: probe-pr
on:
  pull_request:
    branches: [spike/168-base]
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "event=${{ github.event_name }} sha=${{ github.sha }} head=${{ github.event.pull_request.head.sha }}"
          case "$TITLE" in *pr-slow*) sleep 90;; esac
          case "$TITLE" in *pr-pass*) exit 0;; *) exit 1;; esac
