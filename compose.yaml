# Local development and Harness verification only. Not a production deployment definition.
services:
  api:
    build:
      context: ./apps/api
      # CI points these at a restored BuildKit cache. Unset, the import finds nothing (a warning) and the inline export changes nothing.
      cache_from: ["${HARNESS_BUILD_CACHE_FROM:-type=local,src=.no-build-cache}"]
      cache_to: ["${HARNESS_BUILD_CACHE_TO:-type=inline}"]
    command: ["bash", "-c", "rm -f tmp/pids/server.pid && bin/rails db:prepare && bin/rails server -b 0.0.0.0 -p 3000"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_HOST: db
      DATABASE_USERNAME: postgres
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      # Request specs check Rails against the OpenAPI SSOT (spec/support/api_contract.rb); apps/api keeps no copy of it.
      API_SCHEMA_DIR: /api-schema
    volumes:
      - ./apps/api:/rails
      - ./packages/api-schema:/api-schema:ro
      # Keep runtime output inside the container so verifier runs never change the source snapshot.
      - /rails/tmp
      - /rails/log
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      # Local-only container without a published port; no password is stored in Git.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  db-data:
